[files]
extend-exclude = [
  "*.html",
  "*.css",
  "*.json",
  ".quarto/*",
  "_site/*",
  "_book/*",
  "_extensions/*",
  "*.svg",
  "*.bib",
  # If creating releases and using git-cliff, the hashes in the CHANGELOG can
  # falsely trigger typos.
  "CHANGELOG.md",
]

[default.extend-words]
# Don't correct the misspelling of `interntal` in CHANGELOG
# and the raw data script.
interntal = "interntal"
